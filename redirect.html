<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Oasi Kadir</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #262629;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
  }
  .box { text-align: center; padding: 24px; }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: #F2B533;
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  a { color: #F2B533; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p id="msg">Un attimo…</p>
  </div>

<script>
var FALLBACK_URL = "https://oasikadir.it";

function getParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

fetch("links.json?_=" + Date.now())
  .then(function (r) {
    if (!r.ok) throw new Error("links.json non raggiungibile");
    return r.json();
  })
  .then(function (data) {
    var id = (getParam("id") || "").toLowerCase().trim();
    var url = (id && data[id]) ? data[id] : FALLBACK_URL;
    window.location.replace(url);
  })
  .catch(function () {
    document.getElementById("msg").textContent = "Reindirizzo alla home…";
    window.location.replace(FALLBACK_URL);
  });
</script>
</body>
</html>
